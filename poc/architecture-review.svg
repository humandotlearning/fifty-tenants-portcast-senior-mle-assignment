<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Freight operations assistant: current C4 Container diagram</title>
<desc id="desc">Operator to Web Client to API Gateway to Lambda. Lambda calls the LLM and live carrier API and reads Postgres and the vector index. S3 documents are indexed; a background ingest job updates Postgres from a carrier bulk feed. CloudWatch captures logs. This is the existing single-customer POC.</desc>
